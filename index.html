<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumrix — Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #ffffff;
            color: #31386b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 2rem;
        }

        .logo {
            display: inline-block;
            margin-bottom: 2rem;
            text-decoration: none;
        }

        .logo img {
            max-width: 200px;
            height: auto;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            line-height: 1.2;
            color: #31386b;
        }

        .highlight {
            background: linear-gradient(135deg, #6d993e, #9fc65b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        p {
            font-size: 1.1rem;
            color: rgba(49, 56, 107, 0.65);
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .contact-link {
            display: inline-block;
            padding: 0.75rem 2rem;
            background: linear-gradient(135deg, #6d993e, #9fc65b);
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: opacity 0.3s;
        }

        .contact-link:hover {
            opacity: 0.85;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="#" class="logo">
            <img src="logo/LumrixLogo.jpeg" alt="Lumrix Logo">
        </a>
        <h1>This site is under construction</span></h1>
        <p>Our new website is under construction. We're working hard to bring you an amazing experience. Stay tuned!</p>
        <a href="mailto:info@lumrix.in" class="contact-link">Contact Us — info@lumrix.in</a>
    </div>
</body>
</html>
